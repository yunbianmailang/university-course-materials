<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="500" viewBox="0 0 1800 500"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#557F9B"/></marker></defs><rect width="1800" height="500" fill="white"/><g font-family="SimSun,serif" font-size="38" fill="#244B68"><rect x="70" y="110" width="610" height="260" fill="#F0F4F7"/><line x1="60" y1="110" x2="710" y2="110" stroke="#557F9B" stroke-width="3"/><line x1="60" y1="370" x2="710" y2="370" stroke="#557F9B" stroke-width="3"/><text x="80" y="90" font-size="38" fill="#244B68" text-anchor="start">Im z = π</text><text x="80" y="425" font-size="38" fill="#244B68" text-anchor="start">Im z = 0</text><text x="250" y="245" font-size="38" fill="#244B68" text-anchor="start">z = x + iy</text><text x="200" y="305" font-size="38" fill="#244B68" text-anchor="start">0 &lt; y &lt; π</text><line x1="730" y1="240" x2="960" y2="240" stroke="#557F9B" stroke-width="3" marker-end="url(#a)"/><text x="775" y="195" font-size="38" fill="#244B68" text-anchor="start">w = eᶻ</text><rect x="1040" y="60" width="660" height="310" fill="#F0F4F7"/><line x1="1030" y1="370" x2="1720" y2="370" stroke="#71818B" stroke-width="2" marker-end="url(#a)"/><text x="1260" y="170" font-size="42" fill="#244B68" text-anchor="start">Im w &gt; 0</text><text x="1110" y="245" font-size="38" fill="#244B68" text-anchor="start">|w| = eˣ，Arg w = y</text><text x="1100" y="445" font-size="33" fill="#244B68" text-anchor="start">下边界 → 正实轴；上边界 → 负实轴</text></g></svg>