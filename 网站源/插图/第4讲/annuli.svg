<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="520" viewBox="0 0 1800 520"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#557F9B"/></marker></defs><rect width="1800" height="520" fill="white"/><g font-family="SimSun,serif" font-size="38" fill="#244B68"><line x1="110" y1="260" x2="850" y2="260" stroke="#71818B" stroke-width="2" marker-end="url(#a)"/><line x1="480" y1="495" x2="480" y2="25" stroke="#71818B" stroke-width="2" marker-end="url(#a)"/><circle cx="480" cy="260" r="210" fill="#F0F4F7" stroke="#557F9B" stroke-width="3"/><circle cx="480" cy="260" r="105" fill="white" stroke="#557F9B" stroke-width="3"/><circle cx="585" cy="260" r="6" fill="#244B68" stroke="#244B68" stroke-width="3"/><text x="575" y="308" font-size="38" fill="#244B68" text-anchor="start">1/2</text><circle cx="690" cy="260" r="6" fill="#244B68" stroke="#244B68" stroke-width="3"/><text x="705" y="242" font-size="38" fill="#244B68" text-anchor="start">1</text><circle cx="480" cy="260" r="6" fill="#244B68" stroke="#244B68" stroke-width="3"/><text x="457" y="305" font-size="38" fill="#244B68" text-anchor="start">0</text><text x="65" y="505" font-size="33" fill="#244B68" text-anchor="start">同一中心，圆周越过奇点时系数会改变</text><text x="930" y="90" font-size="38" fill="#244B68" text-anchor="start">|z| &lt; 1/2：仅非负幂</text><text x="930" y="200" font-size="38" fill="#244B68" text-anchor="start">1/2 &lt; |z| &lt; 1：正负幂并存</text><text x="930" y="310" font-size="38" fill="#244B68" text-anchor="start">|z| &gt; 1：仅负幂</text><text x="930" y="430" font-size="38" fill="#244B68" text-anchor="start">c₋₁ 依次为 0、1、0</text></g></svg>