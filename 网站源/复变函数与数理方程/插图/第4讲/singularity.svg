<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="500" viewBox="0 0 1800 500"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#557F9B"/></marker></defs><rect width="1800" height="500" fill="white"/><g font-family="SimSun,serif" font-size="38" fill="#244B68"><line x1="170" y1="245" x2="690" y2="245" stroke="#71818B" stroke-width="2" marker-end="url(#a)"/><line x1="430" y1="460" x2="430" y2="30" stroke="#71818B" stroke-width="2" marker-end="url(#a)"/><circle cx="430" cy="245" r="180" fill="#F0F4F7" stroke="#557F9B" stroke-width="3"/><circle cx="250" cy="245" r="80" fill="none" stroke="#A8BDC9" stroke-width="3" stroke-dasharray="9 7"/><circle cx="610" cy="245" r="6" fill="#244B68" stroke="#244B68" stroke-width="3"/><text x="630" y="227" font-size="38" fill="#244B68" text-anchor="start">1：奇点</text><circle cx="250" cy="245" r="6" fill="#244B68" stroke="#244B68" stroke-width="3"/><text x="115" y="297" font-size="38" fill="#244B68" text-anchor="start">−1：仍解析</text><text x="80" y="480" font-size="36" fill="#244B68" text-anchor="start">以原点展开的收敛圆为单位圆</text><text x="960" y="120" font-size="42" fill="#244B68" text-anchor="start">函数：1/(1 − z)</text><text x="960" y="235" font-size="40" fill="#244B68" text-anchor="start">级数：Σ zⁿ，仅 |z| &lt; 1</text><text x="960" y="350" font-size="38" fill="#244B68" text-anchor="start">负一附近可继续解析延拓</text><text x="960" y="455" font-size="34" fill="#244B68" text-anchor="start">原级数发散 ≠ 函数处处有奇点</text></g></svg>