<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="410" viewBox="0 0 1800 410"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#557F9B"/></marker></defs><rect width="1800" height="410" fill="white"/><g font-family="Microsoft YaHei,SimSun,serif" font-size="34" fill="#244B68"><rect x="20" y="40" width="565" height="325" rx="10" fill="#F0F4F7"/><text x="50" y="100" font-size="39" fill="#244B68" text-anchor="start">可去奇点</text><line x1="50" y1="125" x2="550" y2="125" stroke="#D2DEE6" stroke-width="2"/><text x="50" y="190" font-size="38" fill="#244B68" text-anchor="start">负次幂全为零</text><text x="50" y="264" font-size="38" fill="#244B68" text-anchor="start">sin z / z   补值1</text><text x="50" y="325" font-size="38" fill="#71818B" text-anchor="start">有限复极限</text><rect x="615" y="40" width="565" height="325" rx="10" fill="#F0F4F7"/><text x="645" y="100" font-size="39" fill="#244B68" text-anchor="start">m 阶极点</text><line x1="645" y1="125" x2="1145" y2="125" stroke="#D2DEE6" stroke-width="2"/><text x="645" y="190" font-size="38" fill="#244B68" text-anchor="start">有限项 最高负次为 m</text><text x="645" y="264" font-size="38" fill="#244B68" text-anchor="start">sin z / z²   一阶</text><text x="645" y="325" font-size="38" fill="#71818B" text-anchor="start">模趋于无穷大</text><rect x="1210" y="40" width="565" height="325" rx="10" fill="#F0F4F7"/><text x="1240" y="100" font-size="39" fill="#244B68" text-anchor="start">本性奇点</text><line x1="1240" y1="125" x2="1740" y2="125" stroke="#D2DEE6" stroke-width="2"/><text x="1240" y="190" font-size="38" fill="#244B68" text-anchor="start">无穷多个非零负次项</text><text x="1240" y="264" font-size="38" fill="#244B68" text-anchor="start">exp(1/z)   本性</text><text x="1240" y="325" font-size="38" fill="#71818B" text-anchor="start">不具备前两类极限</text></g></svg>