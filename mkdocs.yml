site_name: 大学课程学习资料
site_description: 大学课程个人学习讲义，按学期和课程组织，支持网页端直接阅读
site_url: https://yunbianmailang.github.io/university-course-materials/
repo_url: https://github.com/yunbianmailang/university-course-materials
repo_name: 大学课程学习资料
edit_uri: edit/main/网站源/

docs_dir: 网站源
site_dir: site

theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.share
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

extra_css:
  - stylesheets/custom.css
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: "#"
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode

nav:
  - 首页: index.md
  - 复变函数与数理方程:
      - 课程说明: 复变函数与数理方程/课程说明.md
      - 第1讲 复数几何模的极值与指数映射: 复变函数与数理方程/第1讲_复数几何模的极值与指数映射.md
      - 第2讲 复幂解析性与复平面映射: 复变函数与数理方程/第2讲_复幂解析性与复平面映射.md
      - 第3讲 复积分柯西公式与解析函数的整体性质: 复变函数与数理方程/第3讲_复积分柯西公式与解析函数的整体性质.md
      - 第4讲 幂级数收敛与泰勒洛朗展开: 复变函数与数理方程/第4讲_幂级数收敛与泰勒洛朗展开.md
      - 第5讲 零点奇点与留数积分: 复变函数与数理方程/第5讲_零点奇点与留数积分.md
  - 信号与系统:
      - 课程说明: 信号与系统/课程说明.md
      - 第1讲 学习路线与基本语言: 信号与系统/第1讲_学习路线与基本语言.md
      - 第2讲 微分方程经典法与响应分解: 信号与系统/第2讲_微分方程经典法与响应分解.md
      - 第3讲 傅里叶级数与频谱: 信号与系统/第3讲_傅里叶级数与频谱.md
      - 第4讲 傅里叶变换与典型信号频谱: 信号与系统/第4讲_傅里叶变换与典型信号频谱.md
      - 第5讲 典型变换对与抽样定理: 信号与系统/第5讲_典型变换对与抽样定理.md
      - 第6讲 拉普拉斯变换的性质: 信号与系统/第6讲_拉普拉斯变换的性质.md
      - 第7讲 拉普拉斯逆变换与 s 域模型: 信号与系统/第7讲_拉普拉斯逆变换与 s 域模型.md
      - 第8讲 频率响应与稳定性: 信号与系统/第8讲_频率响应与稳定性.md
  - 基础物理学2（光学）:
      - 课程说明: 基础物理学2/课程说明.md
      - 第1讲 几何光学简介: 基础物理学2/第1讲_几何光学简介.md
      - 第2讲 波动光学基本原理（一）: 基础物理学2/第2讲_波动光学基本原理（一）.md
      - 第3讲 光的干涉与时空相干性: 基础物理学2/第3讲_光的干涉与时空相干性.md
      - 第4讲 光的衍射与分辨本领: 基础物理学2/第4讲_光的衍射与分辨本领.md
      - 第5讲 衍射光栅与晶体衍射: 基础物理学2/第5讲_衍射光栅与晶体衍射.md
      - 第6讲 偏振态与菲涅耳公式: 基础物理学2/第6讲_偏振态与菲涅耳公式.md
      - 第7讲 双折射与偏振光应用: 基础物理学2/第7讲_双折射与偏振光应用.md
